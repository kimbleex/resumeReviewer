<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Premium electric cyan to violet gradient matching the page workspace theme -->
    <linearGradient id="premiumNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="premiumGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing circle ring - completely transparent inside -->
  <circle cx="16" cy="16" r="13" stroke="url(#premiumNeon)" stroke-width="1.8" fill="none" opacity="0.95" filter="url(#premiumGlow)" />
  
  <!-- Stylized folded paper document with glassmorphic semi-transparent dark purple-black fill -->
  <path d="M11 9H18L21 12V23C21 23.55 20.55 24 20 24H11C10.45 24 10 23.55 10 23V10C10 9.45 10.45 9 11 9Z" fill="#0b0c0f" fill-opacity="0.6" stroke="url(#premiumNeon)" stroke-width="1.3" />
  
  <!-- Folded corner indicator -->
  <path d="M18 9V12H21" stroke="url(#premiumNeon)" stroke-width="1.3" fill="none" />
  
  <!-- Content lines -->
  <line x1="13" y1="13" x2="18" y2="13" stroke="url(#premiumNeon)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="13" y1="16" x2="17" y2="16" stroke="url(#premiumNeon)" stroke-width="1.2" stroke-linecap="round" />
  <line x1="13" y1="19" x2="19" y2="19" stroke="url(#premiumNeon)" stroke-width="1.2" stroke-linecap="round" />
  
  <!-- Glowing AI Center Node -->
  <circle cx="21" cy="20" r="2.2" fill="#ffffff" filter="url(#premiumGlow)" />
  <circle cx="21" cy="20" r="1.2" fill="url(#premiumNeon)" />
</svg>
